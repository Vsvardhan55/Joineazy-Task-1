services:

  backend:
    build:
      context: ./backend
    container_name: joineazy-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: joineazy-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped